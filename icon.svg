<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d7a4f"/>
      <stop offset="100%" stop-color="#1a4f32"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6c8"/>
      <stop offset="100%" stop-color="#d4c49a"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- 財布本体 -->
  <rect x="96" y="190" width="320" height="200" rx="28" ry="28" fill="url(#wallet)"/>
  <!-- 財布フラップ -->
  <rect x="96" y="160" width="270" height="58" rx="20" ry="20" fill="#c8b47a"/>
  <!-- コインポケット背景 -->
  <rect x="306" y="220" width="110" height="100" rx="50" ry="50" fill="#1a4f32" opacity="0.2"/>
  <!-- コイン -->
  <circle cx="361" cy="270" r="36" fill="#C9A84C"/>
  <circle cx="361" cy="270" r="28" fill="#d4a820" opacity="0.5"/>
  <text x="361" y="280" font-family="sans-serif" font-size="28" font-weight="bold" fill="#7a5a10" text-anchor="middle">¥</text>
  <!-- カードライン -->
  <rect x="128" y="248" width="148" height="11" rx="5" fill="#a09060" opacity="0.5"/>
  <rect x="128" y="274" width="110" height="10" rx="5" fill="#a09060" opacity="0.35"/>
  <rect x="128" y="298" width="80" height="9" rx="4" fill="#a09060" opacity="0.25"/>
</svg>
